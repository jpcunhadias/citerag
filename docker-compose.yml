version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    # Configure for high memory usage (128GB RAM available)
    mem_limit: 64g
    mem_reservation: 32g
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local

